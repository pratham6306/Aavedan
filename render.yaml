services:
  # 1. Django REST API Backend Service
  - type: web
    name: aavedan-backend
    env: python
    region: singapore
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "cd backend && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aavedan-db
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: aavedan-ai
          property: host

  # 2. FastAPI AI Microservice (Groq / Gemini LLM Orchestrator)
  - type: web
    name: aavedan-ai
    env: python
    region: singapore
    buildCommand: "cd Ai && pip install -r requirements.txt"
    startCommand: "cd Ai && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: aavedan-redis
          property: connectionString

# 3. Managed PostgreSQL Database
databases:
  - name: aavedan-db
    region: singapore
    databaseName: aavedan_setu_db
    user: aavedan_user

# 4. Managed Redis Cache (for AI session memory)
redis:
  - name: aavedan-redis
    region: singapore
    plan: free
